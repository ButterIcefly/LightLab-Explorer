<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>小光实验室：为什么会有影子？</title>
<style>
  :root{
    --bg:#0e1630; --panel:#17213f; --panel2:#202d52; --text:#f7f9ff; --muted:#b9c5e6;
    --accent:#ffd45c; --accent2:#63d6ff; --good:#71e0a8; --danger:#ff8f9b; --line:#6070a8;
    --card:#111a35; --shadow:0 18px 50px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,#21315f 0,#101830 35%,#0b1228 100%);color:var(--text);min-height:100vh}
  button,input{font:inherit}
  .app{max-width:1240px;margin:0 auto;padding:18px}
  .topbar{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-bottom:14px}
  .brand{display:flex;gap:12px;align-items:center}
  .bot-face{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,#88e7ff,#3c81ff);box-shadow:var(--shadow);display:grid;place-items:center;color:#071224;font-weight:900}
  h1{font-size:clamp(20px,3vw,30px);margin:0}.sub{margin-top:3px;color:var(--muted);font-size:14px}
  .progress-area{position:relative;display:flex;align-items:center;justify-content:flex-end}.progress{display:flex;gap:7px;align-items:center}.dot{width:28px;height:28px;border-radius:50%;background:#28365f;border:2px solid #d5b64b;color:#ffe98d;display:grid;place-items:center;font-size:11px;font-weight:900;cursor:pointer;transition:.2s;padding:0}.dot:hover,.dot:focus-visible{transform:translateY(-2px);background:#3b4a76;outline:none;box-shadow:0 0 0 3px rgba(255,212,92,.16)}.dot:disabled{cursor:default;opacity:.72}.dot:disabled:hover,.dot:disabled:focus-visible{transform:none;background:#28365f;box-shadow:none;outline:none}.dot.on:disabled{background:var(--accent);color:#372900;border-color:#fff1a2;box-shadow:0 0 15px rgba(255,212,92,.35);opacity:.9}.dot.on{background:var(--accent);color:#372900;border-color:#fff1a2;box-shadow:0 0 15px rgba(255,212,92,.55)}.dot.current{outline:2px solid #fff;outline-offset:2px}.nav-tip{position:absolute;right:0;top:40px;width:320px;z-index:20;background:#fff3b4;color:#322600;border:2px solid #ffd45c;border-radius:15px;padding:11px 12px;box-shadow:0 14px 34px rgba(0,0,0,.28);font-size:13px;line-height:1.45}.nav-tip::before{content:'';position:absolute;right:28px;top:-9px;width:16px;height:16px;background:#fff3b4;border-left:2px solid #ffd45c;border-top:2px solid #ffd45c;transform:rotate(45deg)}.nav-tip button{margin-left:8px;border:0;border-radius:10px;background:#25345f;color:#fff;padding:6px 10px;font-weight:800;cursor:pointer}
  .layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,.85fr);gap:16px}
  .stage-card,.side{background:linear-gradient(180deg,rgba(30,43,81,.97),rgba(19,29,59,.97));border:1px solid rgba(163,184,255,.14);border-radius:22px;box-shadow:var(--shadow)}
  .stage-card{overflow:hidden}.stage-head{padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .stage-title{font-size:18px;font-weight:800}.stage-chip{font-size:12px;padding:6px 10px;border-radius:999px;background:#24345f;color:#cceaff;border:1px solid #40588e}
  .scene-wrap{position:relative;min-height:560px;background:linear-gradient(#151f3e 0 72%,#27203b 72%);overflow:hidden;touch-action:none}
  .stars{position:absolute;inset:0;opacity:.16;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:30px 30px}
  #scene{position:absolute;inset:0;width:100%;height:100%}
  .scene-ui{position:absolute;inset:0;pointer-events:none}
  .objective{position:absolute;top:14px;left:14px;right:14px;background:rgba(8,14,33,.78);backdrop-filter:blur(9px);border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:11px 13px;color:#eef4ff;font-size:14px;line-height:1.45}
  .objective strong{color:var(--accent)}
  .science-badge{position:absolute;bottom:14px;left:14px;background:rgba(8,14,33,.78);padding:7px 10px;border-radius:12px;color:#aeeaff;border:1px solid #355a79;font-size:12px}
  .side{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:560px}
  .talk{background:var(--card);border-radius:18px;padding:15px;border:1px solid rgba(255,255,255,.08);line-height:1.6}
  .talk .name{color:var(--accent2);font-weight:800;margin-bottom:6px}.talk p{margin:0;color:#edf3ff}
  .controls{display:grid;gap:10px}.btn{border:0;border-radius:14px;padding:12px 14px;cursor:pointer;background:#2a3a69;color:white;font-weight:800;transition:.18s;text-align:left}.btn:hover{transform:translateY(-1px);background:#324779}.btn.primary{background:linear-gradient(135deg,#ffcf4f,#ffb13f);color:#2e2100}.btn.alt{background:linear-gradient(135deg,#4dd1ff,#6d8cff);color:#06162c}.btn.good{background:#2b7d60}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn.experiment-cta{position:relative;text-align:center;padding:17px 16px;font-size:16px;background:linear-gradient(135deg,#ffe66d,#ffb23f);color:#2a1a00;border:2px solid #fff0a9;box-shadow:0 0 0 4px rgba(255,212,92,.12),0 10px 26px rgba(255,177,63,.24);animation:ctaPulse 1.7s ease-in-out infinite}
  .btn.experiment-cta:hover{background:linear-gradient(135deg,#ffef8a,#ffc25d);transform:translateY(-1px) scale(1.01)}
  .btn.experiment-cta::before{content:'▶';margin-right:8px}
  @keyframes ctaPulse{0%,100%{box-shadow:0 0 0 4px rgba(255,212,92,.10),0 10px 26px rgba(255,177,63,.20)}50%{box-shadow:0 0 0 8px rgba(255,212,92,.05),0 12px 30px rgba(255,177,63,.30)}}
  .choice-grid{display:grid;gap:9px}.choice{border:1px solid #415486;background:#18254a;border-radius:14px;padding:10px 12px;cursor:pointer;line-height:1.35}.choice:hover{border-color:#7f9ee6}.choice.selected{outline:2px solid var(--accent);background:#2e3550}
  .mini{font-size:12px;color:var(--muted)}
  .observation{display:grid;gap:7px;max-height:170px;overflow:auto}.obs{font-size:12px;padding:8px 10px;border-radius:11px;background:#13213d;border-left:3px solid var(--accent2);color:#dce8ff}
  .row{display:flex;gap:8px;flex-wrap:wrap}.seg{flex:1;min-width:110px;background:#111b36;padding:10px;border-radius:12px}.seg label{display:block;font-size:12px;color:#c6d1ee;margin-bottom:6px}.seg input{width:100%}
  .footer-nav{display:flex;gap:8px;margin-top:auto}.footer-nav .btn{text-align:center;flex:1}
  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:#111a30;color:white;border:1px solid #51679c;border-radius:999px;padding:10px 15px;transition:.25s;z-index:9;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:#c7d2ef}.legend span{display:inline-flex;align-items:center;gap:5px}.sw{width:12px;height:4px;border-radius:3px;background:#ffe179}.sw.blue{background:#5ad8ff}.sw.dark{background:#111}
  .challenge{background:#131d3a;border-radius:14px;padding:12px;border:1px solid rgba(255,255,255,.08);font-size:13px;line-height:1.5}
  .result{background:linear-gradient(135deg,rgba(95,221,174,.14),rgba(99,214,255,.1));border:1px solid rgba(113,224,168,.35);padding:12px;border-radius:14px;line-height:1.55}
  .hidden{display:none!important}
  @media(max-width:900px){.layout{grid-template-columns:1fr}.side{min-height:auto}.scene-wrap{min-height:520px}.topbar{grid-template-columns:1fr}.progress{justify-content:flex-start}}

  .status-line{background:#12203d;border:1px solid #4d679a;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.45;color:#eaf2ff}
  .status-line.good{border-color:#3f9d78;background:#132d28;color:#dfffee}
  .status-line.bad{border-color:#b65f6d;background:#351c29;color:#ffe7eb}
  .range-value{float:right;color:#ffe074;font-weight:900;font-variant-numeric:tabular-nums}
  .surface-note{background:#151d35;border:1px solid #54658e;border-left:4px solid #ffd45c;border-radius:14px;padding:11px 12px;font-size:13px;line-height:1.55;color:#dbe6ff}
  .cta-guide{font-size:13px;color:#ffe9a6;text-align:center;padding:7px 8px;border-radius:11px;background:rgba(255,212,92,.08);border:1px dashed rgba(255,212,92,.45)}
  .validation-result{border-radius:14px;padding:12px;font-size:13px;line-height:1.55}
  .validation-result.pass{background:#153229;border:1px solid #3c9b74;color:#e3fff1}
  .validation-result.fail{background:#351e28;border:1px solid #a65e6a;color:#ffe9ed}
  #scene [data-drag]{touch-action:none}
  input[type="range"]{accent-color:#ffd45c;cursor:ew-resize}
  .celebration{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(5,10,25,.76);backdrop-filter:blur(8px);padding:18px}.celebrate-card{position:relative;z-index:2;width:min(620px,94vw);background:linear-gradient(180deg,#24345f,#131d3a);border:2px solid rgba(255,225,117,.75);border-radius:26px;padding:28px;box-shadow:0 28px 90px rgba(0,0,0,.48);text-align:center}.celebrate-card h2{margin:0 0 8px;font-size:30px}.celebrate-card p{color:#dce7ff;line-height:1.65}.reflection-prompt{margin:16px 0;background:#101a36;border:1px solid #43598c;border-radius:16px;padding:14px;text-align:left;line-height:1.6}.record-controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}.record-btn{border:0;border-radius:16px;padding:13px 18px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#ffcf4f,#ffb13f);color:#2d2000}.record-btn.stop{background:#ff8793;color:#281116}.record-btn.secondary{background:#2d4076;color:white}.record-state{margin-top:10px;color:#bcd0ff;font-size:13px;min-height:20px}.record-playback{width:100%;margin-top:12px}.confetti-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none}.confetti{position:absolute;top:-30px;width:10px;height:18px;border-radius:3px;animation:confettiFall linear forwards}.confetti:nth-child(5n+1){background:#ffd45c}.confetti:nth-child(5n+2){background:#63d6ff}.confetti:nth-child(5n+3){background:#71e0a8}.confetti:nth-child(5n+4){background:#ff8f9b}.confetti:nth-child(5n){background:#d7a6ff}@keyframes confettiFall{0%{transform:translateY(-40px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:.9}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><div class="bot-face">AI</div><div><h1>小光实验室：为什么会有影子？</h1><div class="sub">9–12 岁 · 从观察、猜想、实验到科学模型</div></div></div>
    <div class="progress-area"><div class="progress" id="progress" aria-label="学习进度"></div><div class="nav-tip hidden" id="navTip"><strong>回顾模式已开启</strong><br>现在可以点击右上角任意黄色圆点，快速回顾对应的 8 个内容。<button id="navTipOk">我知道了</button></div></div>
  </div>

  <div class="layout">
    <section class="stage-card">
      <div class="stage-head"><div class="stage-title" id="stageTitle"></div><div class="stage-chip" id="stageChip"></div></div>
      <div class="scene-wrap" id="sceneWrap">
        <div class="stars"></div>
        <svg id="scene" viewBox="0 0 900 560" preserveAspectRatio="xMidYMid meet" aria-label="互动影子实验场景"></svg>
        <div class="scene-ui"><div class="objective" id="objective"></div><div class="science-badge" id="modeBadge">故事模式</div></div>
      </div>
    </section>

    <aside class="side">
      <div class="talk"><div class="name">🤖 小光</div><p id="talkText"></p></div>
      <div id="statusLine" class="status-line hidden"></div>
      <div id="hintBox" class="hidden challenge"></div>
      <div id="dynamicPanel"></div>
      <div class="footer-nav"><button class="btn" id="prevBtn">← 上一步</button><button class="btn" id="hintBtn">需要提示</button><button class="btn primary" id="nextBtn">继续探索 →</button></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="celebration hidden" id="celebration" role="dialog" aria-modal="true" aria-labelledby="celebrateTitle">
  <div class="confetti-layer" id="confettiLayer"></div>
  <div class="celebrate-card">
    <h2 id="celebrateTitle">🎉 影子探索完成！</h2>
    <p>你已经从观察、猜想、实验一路走到迁移挑战。最后不要背答案，试着用自己的话把发现讲出来。</p>
    <div class="reflection-prompt"><strong>可以说这 3 件事：</strong><br>1. 影子为什么会出现？<br>2. 改变光源、物体或位置时，影子会怎样变化？<br>3. 今天哪个实验最让你意外？为什么？</div>
    <div class="record-controls">
      <button class="record-btn" id="recordBtn">🎙 开始录音</button>
      <button class="record-btn stop hidden" id="stopRecordBtn">■ 停止录音</button>
      <button class="record-btn secondary" id="closeCelebration">回顾 8 个内容</button>
    </div>
    <div class="record-state" id="recordState">点击“开始录音”，用自己的话讲一遍。</div>
    <audio id="recordPlayback" class="record-playback hidden" controls></audio>
  </div>
</div>

<script>
const svg = document.getElementById('scene');
const panel = document.getElementById('dynamicPanel');
const titleEl = document.getElementById('stageTitle');
const chipEl = document.getElementById('stageChip');
const objectiveEl = document.getElementById('objective');
const talkEl = document.getElementById('talkText');
const modeBadge = document.getElementById('modeBadge');
const statusLine = document.getElementById('statusLine');

const FLOOR_Y = 405;
const ROBOT_Y = 349;
const ROBOT_W = 62;
const ROBOT_H = 108;

const S = {
  stage: 0,
  lampOn: false,
  rays: false,
  robotX: 420,
  wallX: 790,
  lampX: 120,
  brightness: 1,
  sourceSize: 18,
  observations: [],
  hypothesis: null,
  material: 'opaque',
  challenge: 0,
  streetPersonX: 430,
  twoLampRight: true,
  wallVisible: true,
  surfaceType: 'wall',
  validationHypothesis: null,
  validationResult: null,
  lastChange: '',
  streetDone: false,
  tutorialActive: true,
  tutorialStep: 0,
  tutorialSeen: Array(8).fill(false),
  eclipseMode: 'solar',
  eclipseMoonX: 455,
  eclipseMoonY: 280,
  eclipseAngle: -Math.PI/2,
  solarDone: false,
  lunarDone: false,
  explorationComplete: false,
  reviewUnlocked: false
};

const stages = [
  {title:'1. 奇怪的影子',chip:'发现现象',mode:'故事模式',obj:'先<strong>打开灯</strong>。灯架、小光都可以按住连续拖动；右侧滑杆也能精确移动。观察墙面与地面上的影子。',talk:'先别急着解释“为什么”。把灯打开，再移动灯架或小光，看看影子的哪一部分发生变化。'},
  {title:'2. 自由调查',chip:'改变变量',mode:'实验模式',obj:'一次只改变一个变量：<strong>光源位置、小光位置、墙面位置、亮度</strong>。收集至少 3 条规律。',talk:'一次只改一个条件。墙上的影子高度和地面上的影子长度会分别标出来，不用靠弹窗猜哪里变了。'},
  {title:'3. 提出假设',chip:'先猜再证',mode:'思考模式',obj:'选择你目前最相信的解释。下一步会<strong>只验证你选中的这一条假设</strong>。如果实验不支持它，就回来重选。',talk:'先形成自己的解释，再让实验来攻击它。选错没关系，但必须用结果修正。'},
  {title:'4. 实验验证',chip:'验证你的选择',mode:'实验模式',obj:'先看“如果这条假设是真的，应该发生什么”，再点击右侧醒目的<strong>执行实验</strong>按钮。',talk:'这一步不会验证别的选项，只检验你刚才选中的解释。实验不支持就重选；支持则直接进入科学透视。'},
  {title:'5. 科学透视',chip:'看见不可见',mode:'科学透视模式',obj:'沿着光路观察：哪些光能继续到达承影面，哪些光被小光挡住。',talk:'重点看光路有没有被遮挡：没有碰到小光的光继续前进，碰到小光的那部分光到不了后方。'},
  {title:'6. 影子为什么变大变小？',chip:'空间关系',mode:'实验模式',obj:'移动<strong>灯、小光和墙面</strong>，观察黄色尺寸标记怎样变化。',talk:'不要只记“靠近就变大”。实际要看光源、遮挡物和承影面三者的位置关系。'},
  {title:'7. 为什么边缘有时模糊？',chip:'光源大小',mode:'进阶实验',obj:'调节<strong>光源大小</strong>，只观察影子边缘：什么时候更清晰，什么时候会出现浅浅的过渡？',talk:'这里不需要记新名词。只要发现：光源很小时边缘更清楚；光源变大后，边缘会逐渐变模糊。'},
  {title:'8. 迁移挑战',chip:'用模型解决新问题',mode:'挑战模式',obj:'把“找光源 → 找遮挡 → 判断哪里收不到直接光”的模型用到路灯、多光源，以及<strong>白天的日全食 / 夜晚的月食</strong>。',talk:'挑战 3 让月球沿地球轨道转动。白天观察月球怎样运行到太阳与地球之间形成日食；夜晚观察月球怎样运行到地球背后并进入地球影子形成月食。'}
];

const hypothesisLabels = [
  '影子是物体自己发出的黑色图像',
  '只有墙会把物体复制成黑色图案',
  '物体挡住了一部分原本会到达表面的光',
  '灯会主动把物体的黑色轮廓画到墙上'
];

const validationInfo = [
  {
    title:'验证 A：关掉光源',
    prediction:'如果黑色图像是物体自己产生的，那么把灯关掉以后，这块黑色图像应该仍然存在。',
    action:'关掉灯看看',
    result:'灯一关，墙面和地面上的影子都消失了。影子依赖外来的光，不是物体自己发出的黑色图像。',
    pass:false
  },
  {
    title:'验证 B：更换承影表面',
    prediction:'如果只有“墙”会复制物体，那么把墙换成普通白纸屏后，不应该出现同样的暗影。',
    action:'换成白纸屏',
    result:'换成白纸屏后，影子仍然出现。表面只是把明暗差异显示出来，并不是墙在复制物体。',
    pass:false
  },
  {
    title:'验证 C：直接看光路',
    prediction:'如果影子来自“挡住一部分光”，那么显示光路后，小光正后方应该缺少能直接到达墙面的光。',
    action:'显示光路验证',
    result:'验证通过：碰到小光的光被挡住；旁边的光继续到达墙面。较暗区域正好出现在缺少直达光的位置。',
    pass:true
  },
  {
    title:'验证 D：外形不变，只改透明度',
    prediction:'如果灯是在主动“画轮廓”，那么物体外形不变时，换成透明材料后应该仍画出同样深的黑色轮廓。',
    action:'换成透明材料',
    result:'外形没有变，但透明以后影子明显变弱。关键不是灯在画轮廓，而是材料到底挡住了多少光。',
    pass:false
  }
];

function progress(){
  const p=document.getElementById('progress');
  p.innerHTML='';
  p.setAttribute('aria-label',S.reviewUnlocked?'章节快速导航':'学习进度（完成全部内容后可解锁回顾导航）');
  stages.forEach((st,i)=>{
    const d=document.createElement('button');
    d.type='button';
    d.className='dot '+(i<=S.stage?'on ':'')+(i===S.stage?'current':'');
    const stageName=st.title.replace(/^\d+\.\s*/, '');
    if(S.reviewUnlocked){
      d.title=`跳转到第 ${i+1} 部分：${stageName}`;
      d.setAttribute('aria-label',d.title);
      d.onclick=()=>jumpToStage(i);
    }else{
      d.disabled=true;
      d.title=`第 ${i+1} 部分：${stageName}。完成全部 8 个内容后可解锁快速回顾。`;
      d.setAttribute('aria-label',d.title);
    }
    p.appendChild(d);
  });
}

let statusTimer=null;
function showStatus(t,type='info',duration=0){
  clearTimeout(statusTimer);
  statusLine.textContent=t;
  statusLine.className='status-line '+type;
  statusLine.classList.remove('hidden');
  if(duration) statusTimer=setTimeout(()=>statusLine.classList.add('hidden'),duration);
}
function clearStatus(){clearTimeout(statusTimer);statusLine.classList.add('hidden');}

function addObs(t){
  if(!S.observations.includes(t)){
    S.observations.push(t);
    if(S.stage===1) renderPanel();
  }
}

function wrapSvgLines(label,w,fontSize=13){

function shadowGeometry(sx,ly,rx,ry,rw,rh,wx){

function shadowMetrics(){
  const sx=sourceX(),ly=265,rx=S.robotX,wx=S.wallX-9;
  const g=currentGeometry();
  const wallTop=clamp(g.yt,98,FLOOR_Y);
  const wallBottom=clamp(g.yb,98,FLOOR_Y);
  const wallH=Math.max(0,wallBottom-wallTop);
  const objTopY=ROBOT_Y-ROBOT_H/2;
  const dy=Math.max(1,objTopY-ly);
  const groundEnd=sx+(FLOOR_Y-ly)*(rx-sx)/dy;
  const floorStart=rx+ROBOT_W/2-4;
  const floorEnd=Math.min(wx,groundEnd);

  const wd=after.wallH-base.wallH,fd=after.floorLen-base.floorLen;

  if(Math.abs(wd)>=3) parts.push(`墙上影子${wd>0?'变高':'变矮'} ${Math.round(base.wallH)}→${Math.round(after.wallH)}`);
  if(Math.abs(fd)>=5) parts.push(`地面影子${fd>0?'变长':'变短'} ${Math.round(base.floorLen)}→${Math.round(after.floorLen)}`);
  if(!parts.length) return `看这里：${subject}这次移动很小，影子边界变化也很小`;
  return `看这里：${parts.join('；')}`;
}

const ECLIPSE_EARTH_X=620, ECLIPSE_EARTH_Y=280, ECLIPSE_ORBIT_R=148;
function normalizeAngle(a){
  while(a<=-Math.PI)a+=Math.PI*2;
  while(a>Math.PI)a-=Math.PI*2;
  return a;
}
function moonOrbitPosition(){
  return {
    x:ECLIPSE_EARTH_X+Math.cos(S.eclipseAngle)*ECLIPSE_ORBIT_R,
    y:ECLIPSE_EARTH_Y+Math.sin(S.eclipseAngle)*ECLIPSE_ORBIT_R
  };
}
function setMoonOrbitFromPointer(x,y){
  S.eclipseAngle=Math.atan2(y-ECLIPSE_EARTH_Y,x-ECLIPSE_EARTH_X);
  const p=moonOrbitPosition();S.eclipseMoonX=p.x;S.eclipseMoonY=p.y;
}
function solarAlignment(){
  const diff=Math.abs(normalizeAngle(S.eclipseAngle-Math.PI));
  return {aligned:diff<0.12,near:diff<0.34,diff};
}
function lunarAlignment(){
  const diff=Math.abs(normalizeAngle(S.eclipseAngle));
  return {aligned:diff<0.12,near:diff<0.34,diff};
}

function renderScene(){
  if(S.stage===0) drawLab({draggableWall:false});
  else if(S.stage===1) drawLab({draggableWall:true});
  else if(S.stage===2) drawLab({labels:true,draggableWall:false});
  else if(S.stage===3) validationScene();
  else if(S.stage===4) drawLab({forceRays:S.rays,labels:true,draggableWall:false});
  else if(S.stage===5){S.rays=true;drawLab({forceRays:true,labels:true,draggableWall:true});}
  else if(S.stage===6) drawPenumbra();
  else if(S.challenge===0) drawStreetChallenge();
  else if(S.challenge===1) drawTwoLamp();
  else drawEclipseChallenge();
  drawGuide();
}

function rangeBlock(id,label,min,max,value,step=1,formatter=null){

}
function syncRangeValue(id,value,formatter=v=>Math.round(v)){

function syncPanelValues(){

function bindPositionRange(id,kind,obs){

  el.onpointerdown=begin;el.onfocus=()=>{if(!base)base=shadowMetrics();};
  el.oninput=e=>{if(!base)base=shadowMetrics();updatePosition(kind,+e.target.value,null,base);scheduleScene();syncPanelValues();};
  el.onchange=()=>{if(S.lampOn)addObs(obs);base=null;renderPanel();};
}
function bindMoonOrbitRange(){

function runValidation(){
  const h=S.validationHypothesis;
  if(h===0){S.lampOn=false;S.validationResult='fail';S.lastChange='灯关掉后，墙上和地面影子一起消失';}
  else if(h===1){S.surfaceType='paper';S.validationResult='fail';S.lastChange='换成白纸屏，影子仍然出现';}
  else if(h===2){S.lampOn=true;S.rays=true;S.validationResult='pass';S.lastChange='小光正后方缺少直达光';}
  else{S.material='glass';S.validationResult='fail';S.lastChange='外形不变，但透明后影子明显变弱';}
  S.tutorialActive=false;
  renderAll();
  const info=validationInfo[h];
  if(info.pass){
    showStatus('验证通过。先看光路结果，随后进入“科学透视”。','good');
    setTimeout(()=>{
      if(S.stage===3&&S.validationHypothesis===2&&S.validationResult==='pass'){
        S.stage=4;S.rays=true;S.material='opaque';S.surfaceType='wall';S.wallVisible=true;S.lastChange='';
        clearStatus();renderAll();
      }
    },1800);
  }else showStatus('实验结果不支持这条假设。使用右下角“重新选择”修改假设。','bad');
}
function prepareValidation(){
  S.validationHypothesis=S.hypothesis;S.validationResult=null;S.lampOn=true;S.rays=false;S.wallVisible=true;S.surfaceType='wall';S.material='opaque';S.lastChange='';S.tutorialActive=false;

    panel.innerHTML=`
      <div class="legend"><span><i class="sw"></i>被小光挡住的光 / 边界</span><span><i class="sw blue"></i>能到达墙面的光</span></div>
      <div class="result"><strong>核心模型：</strong><br>小光挡住了一部分原本会继续传播的直接光，所以它后方的表面收到的直达光更少，那里看起来较暗，这就是影子。</div>
      <div class="controls"><button class="btn alt" id="rayBtn">${S.rays?'隐藏光路':'显示光路'}</button></div>`;
    document.getElementById('rayBtn').onclick=()=>{S.rays=!S.rays;renderAll();};
  }else if(S.stage===5){
    const m=shadowMetrics();
    panel.innerHTML=`
      <div class="result"><strong>观察两个尺寸：</strong><br>墙上影子高度：<b>${Math.round(m.wallH)}</b>　地面影子长度：<b>${Math.round(m.floorLen)}</b><br>移动灯、小光或墙面，比较这两个数怎样变化。</div>
      <div class="row">${rangeBlock('lampX','灯架位置',70,Math.min(255,S.robotX-155),S.lampX)}${rangeBlock('robotX','小光位置',Math.max(260,S.lampX+155),Math.min(670,S.wallX-110),S.robotX)}</div>
      <div class="row">${rangeBlock('wallX','墙面位置',Math.max(650,S.robotX+110),855,S.wallX)}</div>`;
    bindPositionRange('lampX','lamp','移动光源 → 影子分布改变');bindPositionRange('robotX','robot','移动小光 → 墙上与地面影子重新分配');bindPositionRange('wallX','wall','移动墙面 → 影子分布改变');
  }else if(S.stage===6){
    panel.innerHTML=`<div class="result"><strong>这一步只观察“清楚还是模糊”：</strong><br>光源很小时，影子边缘通常更清楚；光源变大后，不同位置发出的光会叠加，边缘会出现浅浅的过渡，看起来更模糊。</div>${rangeBlock('size','光源大小',2,45,S.sourceSize)}<div class="mini">可以直接上下拉伸左侧黄色光源，也可以拖右侧滑杆；两边会同步。不要背新名词，只比较边缘变化。</div>`;
    const size=document.getElementById('size');size.oninput=e=>{S.sourceSize=+e.target.value;scheduleScene();syncPanelValues();};
  }else{
    if(S.challenge===0){
      panel.innerHTML=`<div class="challenge"><strong>挑战 1/3：路灯下的人</strong><br>拖动人，让黄色地面标尺显示的影子长度超过 3 米。</div>${rangeBlock('streetX','人物位置',310,770,S.streetPersonX)}<div class="mini">人物可直接按住连续拖动。完成后使用右下角“继续探索”。</div>`;
      const street=document.getElementById('streetX');street.oninput=e=>{updatePosition('street',+e.target.value);scheduleScene();syncPanelValues();};
    }else if(S.challenge===1){
      panel.innerHTML=`<div class="challenge"><strong>挑战 2/3：两盏舞台灯</strong><br>先观察两个影子，再关掉右灯，判断哪一套影子消失。</div><div class="controls"><button class="btn alt" id="lamp2">${S.twoLampRight?'关掉右灯':'打开右灯'}</button></div><div class="mini">完成后继续使用右下角“继续探索”。</div>`;
      document.getElementById('lamp2').onclick=()=>{S.twoLampRight=!S.twoLampRight;renderAll();};
    }else{
      const solar=S.eclipseMode==='solar';
      const done=solar?S.solarDone:S.lunarDone;
      const angleDeg=(S.eclipseAngle*180/Math.PI+360)%360;
      panel.innerHTML=`
        <div class="challenge"><strong>挑战 3/3：日食与月食</strong><br>${solar?'白天：月球只能沿地球周围的圆形轨道转动。把它转到太阳与地球之间并对齐，月球的影子落到地球白天侧时可能形成日全食。':'夜晚：继续让月球沿同一条轨道运行到地球背向太阳的一侧。月球进入地球背后的影子区域时形成月食。'}</div>
        <div class="row"><button class="btn ${solar?'primary':''}" id="solarMode">白天 · 日全食</button><button class="btn ${!solar?'primary':''}" id="lunarMode">夜晚 · 月食</button></div>
        ${rangeBlock('moonAngle','月球沿轨道的位置',0,360,angleDeg,1,v=>`${Math.round(v)}°`)}
        <div class="mini">优先直接拖动画面中的月球：它会被限制在圆形轨道上，不会随意平移。滑杆和圆形拖动同步。</div>
        <div class="result"><strong>${done?'✓ 已完成本模式对齐':'当前目标'}</strong><br>${solar?'太阳 → 月球 → 地球：月球挡住太阳光，日食发生在白天侧。':'太阳 → 地球 → 月球：地球挡住太阳光，月球进入地球影子，月食在夜晚观察。'}</div>
        ${S.solarDone&&S.lunarDone?'<div class="result"><strong>两个现象的共同模型：</strong><br>都是“光源—遮挡物—影子区域”。这个二维实验把月球轨道简化成同一平面；现实中月球轨道相对黄道约倾斜 5°，所以不是每个月都会发生日食或月食。</div>':''}`;
      document.getElementById('solarMode').onclick=()=>{S.eclipseMode='solar';S.tutorialActive=false;renderAll();};
      document.getElementById('lunarMode').onclick=()=>{S.eclipseMode='lunar';S.tutorialActive=false;renderAll();};
      bindMoonOrbitRange();
    }
  }
}

let renderRaf=0;
function scheduleScene(){if(renderRaf)return;renderRaf=requestAnimationFrame(()=>{renderRaf=0;renderScene();});}
function clientToSvg(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
let dragState=null;
svg.addEventListener('pointerdown',e=>{
  const guide=e.target.closest&&e.target.closest('[data-guide-next]');
  if(guide){e.preventDefault();return;}
  const target=e.target.closest&&e.target.closest('[data-drag]');if(!target)return;
  const kind=target.getAttribute('data-drag');if(!kind)return;
  e.preventDefault();
  dragState={kind,pointerId:e.pointerId,startMetrics:(kind==='lamp'||kind==='robot'||kind==='wall')?shadowMetrics():null};
  try{svg.setPointerCapture(e.pointerId);}catch(err){}
  document.body.style.userSelect='none';
});
svg.addEventListener('pointermove',e=>{
  if(!dragState||e.pointerId!==dragState.pointerId)return;
  e.preventDefault();const p=clientToSvg(e);
  if(dragState.kind==='sourceTop') S.sourceSize=clamp((260-p.y)/2.4,2,45);
  else if(dragState.kind==='sourceBottom') S.sourceSize=clamp((p.y-260)/2.4,2,45);
  else if(dragState.kind==='moonOrbit') setMoonOrbitFromPointer(p.x,p.y);
  else updatePosition(dragState.kind,p.x,p.y,dragState.startMetrics);
  scheduleScene();syncPanelValues();
});
function endDrag(e){
  if(!dragState||(e.pointerId!=null&&e.pointerId!==dragState.pointerId))return;
  const kind=dragState.kind,base=dragState.startMetrics;dragState=null;document.body.style.userSelect='';
  try{svg.releasePointerCapture(e.pointerId);}catch(err){}
  if(S.lampOn&&kind==='robot') addObs(describeMetricChange(base,shadowMetrics(),'移动小光').replace('看这里：','移动小光 → '));
  if(S.lampOn&&kind==='lamp') addObs(describeMetricChange(base,shadowMetrics(),'移动光源').replace('看这里：','移动光源 → '));
  if(S.lampOn&&kind==='wall') addObs(describeMetricChange(base,shadowMetrics(),'移动墙面').replace('看这里：','移动墙面 → '));
  if(kind==='street'&&streetShadowData().len/70>=3)S.streetDone=true;
  if(kind==='moonOrbit'){if(S.eclipseMode==='solar'&&solarAlignment().aligned)S.solarDone=true;if(S.eclipseMode==='lunar'&&lunarAlignment().aligned)S.lunarDone=true;}
  renderPanel();renderScene();
}
svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);
svg.addEventListener('click',e=>{const g=e.target.closest&&e.target.closest('[data-guide-next]');if(g){e.preventDefault();advanceGuide();}});

function jumpToStage(i){
  if(!S.reviewUnlocked)return;
  if(i<0||i>=stages.length)return;
  document.getElementById('celebration').classList.add('hidden');
  S.stage=i;S.challenge=0;S.lastChange='';S.explorationComplete=false;clearStatus();
  if(i>=4)S.lampOn=true;
  if(i===3){
    if(S.hypothesis!=null)prepareValidation();
    else{S.validationHypothesis=null;S.validationResult=null;S.lampOn=true;}
  }
  resetGuideForStage(false);
  renderAll();
  showStatus(`已跳转到第 ${i+1} 部分。回顾模式中可以继续用右上角圆点切换内容。`,'info',1800);
}

function resetGuideForStage(auto=false){S.tutorialStep=0;S.tutorialActive=auto;}
function renderAll(){
  const st=stages[S.stage];titleEl.textContent=S.stage===7?`8. 迁移挑战 · 挑战 ${S.challenge+1}/3`:st.title;chipEl.textContent=st.chip;talkEl.textContent=st.talk;modeBadge.textContent=st.mode;objectiveEl.innerHTML=st.obj;
  document.getElementById('hintBox').classList.add('hidden');progress();renderScene();renderPanel();
  const prev=document.getElementById('prevBtn'),next=document.getElementById('nextBtn'),hint=document.getElementById('hintBtn');
  prev.disabled=S.stage===0;hint.textContent='需要提示';
  if(S.stage===3){
    const hasValidation=S.validationHypothesis!=null;
    const failed=hasValidation&&S.validationResult&&validationInfo[S.validationHypothesis]&&!validationInfo[S.validationHypothesis].pass;
    next.disabled=!failed;next.textContent=failed?'重新选择':(hasValidation?'先执行当前验证':'先选择要验证的假设');
  }
  else if(S.explorationComplete){next.disabled=true;next.textContent='探索完成 ✓';}
  else{next.disabled=false;next.textContent='继续探索 →';}
}

document.getElementById('hintBtn').onclick=restartGuide;
document.getElementById('prevBtn').onclick=()=>{
  if(S.stage>0){
    S.stage--;if(S.stage!==3){S.validationResult=null;S.validationHypothesis=null;}S.challenge=0;S.lastChange='';S.explorationComplete=false;resetGuideForStage(false);clearStatus();renderAll();
  }
};
document.getElementById('nextBtn').onclick=()=>{
  if(S.stage===0&&!S.lampOn){showStatus('先打开灯，再继续。首次指引会告诉你拖哪里、看哪里。','bad',2600);return;}
  if(S.stage===1&&S.observations.length<3){showStatus(`目前记录了 ${S.observations.length} 条规律，还需要至少 ${3-S.observations.length} 条。`,'bad',2600);return;}
  if(S.stage===2&&S.hypothesis===null){showStatus('先选一个你目前最相信的假设。','bad',2400);return;}
  if(S.stage===2){S.stage=3;prepareValidation();clearStatus();renderAll();return;}
  if(S.stage===3){
    const failed=S.validationResult&&validationInfo[S.validationHypothesis]&&!validationInfo[S.validationHypothesis].pass;
    if(failed){S.stage=2;S.hypothesis=null;S.validationHypothesis=null;S.validationResult=null;S.lampOn=true;S.surfaceType='wall';S.material='opaque';S.lastChange='';clearStatus();renderAll();}
    else showStatus('先点击右侧黄色“执行实验”按钮完成当前验证。','bad',2200);
    return;
  }
  if(S.stage===7){
    if(S.challenge===0){
      if(streetShadowData().len/70<3){showStatus('先把黄色地面标尺拉到 3 米以上。','bad',2400);return;}
      S.challenge=1;S.lastChange='';resetGuideForStage(false);clearStatus();renderAll();return;
    }
    if(S.challenge===1){
      if(S.twoLampRight){showStatus('先关掉右边的灯，确认少了一套影子，再继续。','bad',2400);return;}
      S.challenge=2;S.eclipseMode='solar';S.eclipseAngle=-Math.PI/2;setMoonOrbitFromPointer(ECLIPSE_EARTH_X,ECLIPSE_EARTH_Y-ECLIPSE_ORBIT_R);resetGuideForStage(false);clearStatus();renderAll();return;
    }
    if(S.challenge===2){
      if(S.eclipseMode==='solar'){
        if(!S.solarDone){showStatus('先把月球拖到太阳和地球之间并对齐，形成日全食条件。','bad',2600);return;}
        S.eclipseMode='lunar';resetGuideForStage(false);showStatus('日食条件已找到。现在切到夜晚：继续沿圆形轨道把月球转到地球背后的影子区域。','good',3200);renderAll();return;
      }
      if(!S.lunarDone){showStatus('先把月球沿轨道转进地球背后的影子区域。','bad',2400);return;}
      if(!S.solarDone){S.eclipseMode='solar';showStatus('月食条件已找到。还需要完成白天的日食对齐。','good',2800);renderAll();return;}
      S.explorationComplete=true;showStatus('完成：你已经走完全部 8 个部分。','good');renderAll();setTimeout(showCelebration,250);return;
    }
  }
  S.stage++;S.challenge=0;S.lastChange='';if(S.stage>=4)S.lampOn=true;resetGuideForStage(false);clearStatus();renderAll();
};


// 右上角章节导航：第一次学习只显示进度；完成后主动选择“回顾 8 个内容”才解锁
const navTip=document.getElementById('navTip');
document.getElementById('navTipOk').onclick=()=>navTip.classList.add('hidden');

// 完成庆祝与口头复述录音
const celebration=document.getElementById('celebration');
const confettiLayer=document.getElementById('confettiLayer');
const recordBtn=document.getElementById('recordBtn');
const stopRecordBtn=document.getElementById('stopRecordBtn');
const recordState=document.getElementById('recordState');
const recordPlayback=document.getElementById('recordPlayback');
let mediaRecorder=null,recordChunks=[],recordStream=null,recordUrl=null;
function launchConfetti(){
  confettiLayer.innerHTML='';
  for(let i=0;i<90;i++){
    const c=document.createElement('span');c.className='confetti';
    c.style.left=(Math.random()*100)+'%';
    c.style.animationDuration=(2.8+Math.random()*2.8)+'s';
    c.style.animationDelay=(Math.random()*.8)+'s';
    c.style.transform=`rotate(${Math.random()*180}deg)`;
    c.style.width=(7+Math.random()*7)+'px';c.style.height=(10+Math.random()*12)+'px';
    confettiLayer.appendChild(c);
  }
  setTimeout(()=>{confettiLayer.innerHTML='';},6500);
}
function showCelebration(){celebration.classList.remove('hidden');launchConfetti();}
document.getElementById('closeCelebration').onclick=()=>{
  S.reviewUnlocked=true;
  celebration.classList.add('hidden');
  progress();
  navTip.classList.remove('hidden');
  showStatus('回顾模式已开启：现在可以点击右上角 1–8 圆点快速回顾任意部分。','good',3200);
};
async function startRecording(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==='undefined'){
    recordState.textContent='当前浏览器不支持网页录音。可以换用最新版 Chrome / Edge / Safari，或直接口头讲给家长听。';return;
  }
  try{
    recordStream=await navigator.mediaDevices.getUserMedia({audio:true});
    recordChunks=[];
    const opts=MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?{mimeType:'audio/webm;codecs=opus'}:undefined;
    mediaRecorder=new MediaRecorder(recordStream,opts);
    mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)recordChunks.push(e.data);};
    mediaRecorder.onstop=()=>{
      const type=mediaRecorder.mimeType||'audio/webm';
      const blob=new Blob(recordChunks,{type});
      if(recordUrl)URL.revokeObjectURL(recordUrl);
      recordUrl=URL.createObjectURL(blob);recordPlayback.src=recordUrl;recordPlayback.classList.remove('hidden');
      recordState.textContent='录音完成。先听一遍：你有没有说清楚“光源—遮挡—影子”的关系？';
      recordBtn.classList.remove('hidden');stopRecordBtn.classList.add('hidden');
      if(recordStream){recordStream.getTracks().forEach(t=>t.stop());recordStream=null;}
    };
    mediaRecorder.start();recordBtn.classList.add('hidden');stopRecordBtn.classList.remove('hidden');recordPlayback.classList.add('hidden');
    recordState.textContent='正在录音……用自己的话讲，不需要背课本句子。';
  }catch(err){recordState.textContent='没有获得麦克风权限。请允许麦克风后再试；也可以直接口头复述。';}
}
recordBtn.onclick=startRecording;
stopRecordBtn.onclick=()=>{if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();};

renderAll();

</script>
